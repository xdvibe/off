name: Fantik69 sample non-chatroulette streams
on:
  push:
    branches: [fantik69-nonchat-14sec-20261125]
    paths: ['sample_nonchat_vods.py','.github/workflows/fantik69-nonchat-samples.yml']
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install -q -U yt-dlp Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - run: python -u sample_nonchat_vods.py
      - name: Upload snippets and montage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fantik69-nonchat-source-samples
          path: nonchat_sample/
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
