name: Fantik69 new four clips 09 through 12
on:
  push:
    branches: [fantik69-extra8-2936145096]
    paths:
      - '.github/workflows/fantik69-extra8.yml'
      - 'fantik69_vod_editor.py'
  workflow_dispatch:
jobs:
  extra-four:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install -q 'yt-dlp>=2026.1.1' 'faster-whisper>=1.1' numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Create four non-repeating Twitch highlights and Russian subtitles
        run: |
          python -u fantik69_vod_editor.py --url 'https://m.twitch.tv/videos/2936145096'
      - name: Upload clips 09 to 12
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fantik69-09-12-four-new-clips
          path: |
            fantik69_result/clips/*.mp4
            fantik69_result/clips/*.ass
            fantik69_result/*.zip
            fantik69_result/selected_moments.json
          retention-days: 7
          if-no-files-found: warn
