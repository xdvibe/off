name: FAST Fantik69 four captioned highlights
on:
  push:
    branches: [fantik69-fast-2936145096]
    paths:
      - '.github/workflows/fantik69-fast.yml'
      - 'fantik69_vod_editor.py'
  workflow_dispatch:
jobs:
  fast-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python -m pip install -q 'yt-dlp>=2026.1.1' 'faster-whisper>=1.1' numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Download VOD and generate four fast captioned highlights
        run: |
          python -u fantik69_vod_editor.py --url 'https://m.twitch.tv/videos/2936145096'
      - name: Upload finished shorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fantik69-four-fast-captioned-MP4
          path: |
            fantik69_result/clips/*.mp4
            fantik69_result/clips/*.ass
            fantik69_result/*.zip
            fantik69_result/selected_moments.json
          retention-days: 7
          if-no-files-found: warn
