name: Fantik69 inspect popular non-chatroulette moments
on:
  push:
    branches: [fantik69-nonchat-14sec-20261125]
    paths: ['download_nonchat_top_clips.py','.github/workflows/fantik69-topclips-download.yml']
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 45558545772
          name: Fantik69-top-clips
          path: input
          github-token: ${{ github.token }}
      - run: |
          python -m pip install -q yt-dlp Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - run: python -u download_nonchat_top_clips.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fantik69-nonchat-best-moments
          path: top_clip_media/
          compression-level: 0
          retention-days: 5
          if-no-files-found: warn