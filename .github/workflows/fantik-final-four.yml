name: Verify final strong Fantik clips
on:
  push:
    branches: [fantik69-final-four-20261126]
    paths: [verify_final_candidates.py, .github/workflows/fantik-final-four.yml]
  workflow_dispatch:
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        day: ['21', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip uninstall -y opencv-python opencv-contrib-python opencv-contrib-python-headless opencv-python-headless || true
          python -m pip install -q -U yt-dlp pillow 'numpy==2.2.6' 'opencv-python-headless==4.11.0.86' faster-whisper
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: python -u verify_final_candidates.py "${{ matrix.day }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fantik69-final-candidates-${{ matrix.day }}
          path: finished/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
