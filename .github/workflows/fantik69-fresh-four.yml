name: Fantik69 four new vertical scenes
on:
  push:
    branches: [fantik69-fresh-four-20261126]
    paths: [fresh_fantik_four.py, .github/workflows/fantik69-fresh-four.yml]
  workflow_dispatch:
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        day: ['21', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -q -U yt-dlp faster-whisper numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: python -u fresh_fantik_four.py "${{ matrix.day }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fantik69-new-${{ matrix.day }}-November
          path: finished/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
  combine:
    needs: edit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Fantik69-new-*-November
          path: combined
          merge-multiple: true
      - run: test "$(find combined -name '*.mp4' | wc -l)" = 4
      - uses: actions/upload-artifact@v4
        with:
          name: Fantik69-four-fresh-vertical-clips
          path: combined/
          compression-level: 0
          retention-days: 7
