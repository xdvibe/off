name: Fantik69 recent two streams scene selection
on:
  push:
    branches: [fantik69-latest-two-4x14-20261125]
    paths:
      - sample_fantik_recent2.py
      - .github/workflows/fantik69-recent2-samples.yml
  workflow_dispatch:
jobs:
  inspect-recent:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and recognition
        run: |
          python -m pip install -q -U yt-dlp faster-whisper numpy Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Inspect both streams and transcribe scenes
        run: python -u sample_fantik_recent2.py
      - name: Upload source scenes and contact boards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fantik69-recent2-scene-candidates
          path: recent2_samples/
          compression-level: 0
          retention-days: 5
          if-no-files-found: warn
