name: Find Fantik69 historic Twitch clips
on:
  push:
    branches: [fantik69-new4-curated-20261125]
    paths: ['fantik_older_clips.py','.github/workflows/fantik-older-clips.yml']
  workflow_dispatch:
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests
      - run: python -u fantik_older_clips.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fantik69-historical-clip-index
          path: more/
          retention-days: 3
          if-no-files-found: warn
