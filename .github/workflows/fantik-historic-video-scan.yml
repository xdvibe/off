name: Review Fantik69 best older moments
on:
  push:
    branches: [fantik69-new4-curated-20261125]
    paths: ['fantik_historic_candidates.py','.github/workflows/fantik-historic-video-scan.yml']
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          python -m pip install -q -U yt-dlp faster-whisper numpy requests Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download clips and transcribe shortlist
        run: python -u fantik_historic_candidates.py
      - name: Upload source scenes and frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fantik69-historic-funny-candidates
          path: historic_candidates/
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
