name: Fantik69 transcribe nonchat candidate clips
on:
  push:
    branches: [fantik69-nonchat-14sec-20261125]
    paths: ['transcribe_nonchat_samples.py','.github/workflows/fantik69-nonchat-transcribe.yml']
  workflow_dispatch:
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 45557887262
          name: Fantik69-nonchat-source-samples
          path: samples
          github-token: ${{ github.token }}
      - run: |
          python -m pip install -q faster-whisper numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - run: python -u transcribe_nonchat_samples.py
      - name: Upload speech transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fantik69-nonchat-transcripts
          path: transcripts.json
          if-no-files-found: warn
          retention-days: 5