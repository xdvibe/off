name: Fantik69 discover best clips non-chatroulette
on:
  push:
    branches: [fantik69-nonchat-14sec-20261125]
    paths: ['fetch_nonchat_twitch_clips.py','.github/workflows/fantik69-discover-clips.yml']
  workflow_dispatch:
jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests
      - run: python fetch_nonchat_twitch_clips.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fantik69-top-clips
          path: clip_candidates/clips.json
          retention-days: 3
          if-no-files-found: warn
